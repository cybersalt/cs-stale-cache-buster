; Plugin name and description (installer, Plugin Manager, Extensions Manager)
PLG_SYSTEM_STALECACHEBUSTER="System - CS Stale Cache Buster"
PLG_SYSTEM_STALECACHEBUSTER_DESCRIPTION="Προσθέτει μια έκδοση βάσει της ημερομηνίας τροποποίησης στις διευθύνσεις URL των αρχείων CSS του προτύπου σας, ώστε οι browsers να φορτώνουν νέο αντίγραφο μόλις αλλάξει ένα φύλλο στυλ του προτύπου. Επηρεάζει μόνο τα αρχεία CSS του προτύπου του ιστότοπου, όχι το JavaScript ή τα στοιχεία επεκτάσεων τρίτων."

; Basic settings
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_LABEL="Αποτροπή προσωρινής αποθήκευσης διαχείρισης"
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_DESC="Αποστολή κεφαλίδων no-cache σε όλες τις σελίδες διαχείρισης. Έτσι το Cloudflare και οι browsers δεν αποθηκεύουν ποτέ προσωρινά το backend, αποφεύγοντας παλιές σελίδες ή σφάλματα 404 στη διαχείριση."
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_LABEL="Λειτουργία εντοπισμού σφαλμάτων"
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_DESC="Όταν είναι ενεργοποιημένη, προστίθεται ένα σχόλιο HTML πριν από την καταληκτική ετικέτα body, με όλες τις διευθύνσεις URL CSS του προτύπου που τροποποιήθηκαν. Δείτε τον πηγαίο κώδικα της σελίδας για να διαβάσετε το αρχείο καταγραφής. Απενεργοποιήστε την σε παραγωγικό ιστότοπο."

