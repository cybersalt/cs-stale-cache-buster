; Plugin name and description (installer, Plugin Manager, Extensions Manager)
PLG_SYSTEM_STALECACHEBUSTER="System - CS Stale Cache Buster"
PLG_SYSTEM_STALECACHEBUSTER_DESCRIPTION="Ajoute une version basée sur la date de modification aux URL des fichiers CSS de votre template, afin que les navigateurs récupèrent une copie à jour dès qu'une feuille de style du template change. Il ne concerne que les fichiers CSS du template de votre site, pas JavaScript ni les ressources des extensions tierces."

; Basic settings
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_LABEL="Empêcher la mise en cache de l'administration"
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_DESC="Envoie des en-têtes no-cache sur toutes les pages de l'administration. Cloudflare et les navigateurs ne mettent ainsi jamais le backend en cache, ce qui évite les pages d'administration obsolètes ou en erreur 404."
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_LABEL="Mode débogage"
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_DESC="Si cette option est activée, un commentaire HTML listant chaque URL CSS de template modifiée est ajouté avant la balise de fermeture du body. Affichez le code source de la page pour consulter ce journal. À désactiver en production."

