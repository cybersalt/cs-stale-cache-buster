; This file and plg_system_stalecachebuster.sys.ini hold exactly the same
; strings. The .sys.ini file is the one Joomla loads in the installer, the
; Plugin Manager and the Extensions Manager; the .ini file is loaded on the
; plugin settings screen. Keep the two files identical.

; Plugin name and description (installer, Plugin Manager, Extensions Manager)
PLG_SYSTEM_STALECACHEBUSTER="System - CS Stale Cache Buster"
PLG_SYSTEM_STALECACHEBUSTER_DESCRIPTION="为模板 CSS 的 URL 添加基于文件修改时间的版本号，这样模板样式表一有改动，浏览器就会立即获取新的副本。它只处理网站模板的 CSS 文件，不会影响 JavaScript 或第三方扩展的资源。"

; Basic settings
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_LABEL="禁止缓存管理后台"
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_DESC="在所有管理后台页面发送 no-cache 标头，告诉 Cloudflare 和浏览器永远不要缓存后台，避免出现过期页面或 404 管理页面。"
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_LABEL="调试模式"
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_DESC="启用后，会在结束 body 标签之前添加一条 HTML 注释，列出所有被修改的模板 CSS URL。查看页面源代码即可看到该记录。在正式站点上请关闭。"

