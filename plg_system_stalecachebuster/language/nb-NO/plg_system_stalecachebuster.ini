; Plugin name and description (installer, Plugin Manager, Extensions Manager)
PLG_SYSTEM_STALECACHEBUSTER="System - CS Stale Cache Buster"
PLG_SYSTEM_STALECACHEBUSTER_DESCRIPTION="Legger til en versjon basert på filens endringstidspunkt i CSS-URL-ene til malen din, slik at nettleserne henter en ny kopi så snart et stilark i malen endres. Den berører bare CSS-filene i nettstedsmalen, ikke JavaScript eller ressurser fra tredjepartsutvidelser."

; Basic settings
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_LABEL="Hindre hurtigbuffring av administrasjonen"
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_DESC="Send no-cache-headere på alle administratorsider. Dette forteller Cloudflare og nettlesere at de aldri skal bufre administrasjonsdelen, slik at du slipper utdaterte sider eller 404-feil i administrasjonen."
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_LABEL="Feilsøkingsmodus"
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_DESC="Når dette er aktivert, legges det til en HTML-kommentar før avsluttende body-tagg med alle CSS-URL-er i malen som ble endret. Vis sidekilden for å se loggen. Slå av på live-nettsteder."

