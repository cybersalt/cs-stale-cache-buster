; Plugin name and description (installer, Plugin Manager, Extensions Manager)
PLG_SYSTEM_STALECACHEBUSTER="System - CS Stale Cache Buster"
PLG_SYSTEM_STALECACHEBUSTER_DESCRIPTION="Voegt een versie op basis van de wijzigingsdatum toe aan de CSS-URL's van je template, zodat browsers meteen een verse kopie ophalen zodra een stylesheet van het template verandert. Alleen de CSS-bestanden van het sitetemplate worden aangepast, geen JavaScript en geen bestanden van extensies van derden."

; Basic settings
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_LABEL="Caching van beheer voorkomen"
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_DESC="Stuur no-cache-headers mee op alle beheerpagina's. Zo weten Cloudflare en browsers dat ze de backend nooit mogen cachen, waardoor verouderde of ontbrekende (404) beheerpagina's niet meer voorkomen."
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_LABEL="Debugmodus"
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_DESC="Indien ingeschakeld wordt vlak voor de afsluitende body-tag een HTML-opmerking toegevoegd met alle aangepaste CSS-URL's van het template. Bekijk de paginabron om het logboek te zien. Schakel dit uit op een live site."

