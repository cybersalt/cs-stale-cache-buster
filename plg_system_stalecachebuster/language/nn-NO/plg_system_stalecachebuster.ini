; Plugin name and description (installer, Plugin Manager, Extensions Manager)
PLG_SYSTEM_STALECACHEBUSTER="System - CS Stale Cache Buster"
PLG_SYSTEM_STALECACHEBUSTER_DESCRIPTION="Legg til ein versjon basert på endringstidspunktet til fila i CSS-URL-ane til malen din, slik at nettlesarane hentar ein ny kopi så snart eit stilark i malen vert endra. Han rører berre CSS-filene i nettstadsmalen, ikkje JavaScript eller ressursar frå tredjepartsutvidingar."

; Basic settings
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_LABEL="Hindre mellomlagring av administrasjonen"
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_DESC="Send no-cache-headarar på alle administratorsider. Dette fortel Cloudflare og nettlesarar at dei aldri skal mellomlagre administrasjonsdelen, slik at du slepp utdaterte sider eller 404-feil i administrasjonen."
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_LABEL="Feilsøkingsmodus"
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_DESC="Når dette er aktivert, vert det lagt til ein HTML-kommentar før avsluttande body-tagg med alle CSS-URL-ar i malen som vart endra. Vis sidekjelda for å sjå loggen. Slå av på live-nettstader."

