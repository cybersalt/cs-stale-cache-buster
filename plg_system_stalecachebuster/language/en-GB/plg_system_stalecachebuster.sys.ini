; Plugin Manager and the Extensions Manager; the .ini file is loaded on the
; plugin settings screen. Keep the two files identical.

; Plugin name and description (installer, Plugin Manager, Extensions Manager)
PLG_SYSTEM_STALECACHEBUSTER="System - CS Stale Cache Buster"
PLG_SYSTEM_STALECACHEBUSTER_DESCRIPTION="Adds a file-modification version to your template CSS URLs, so browsers fetch a fresh copy as soon as a template stylesheet changes. It only touches your site template CSS files, not JavaScript or third-party extension assets."

; Basic settings
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_LABEL="Prevent Admin Caching"
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_DESC="Send no-cache headers on all administrator pages. This tells Cloudflare and browsers to never cache the backend, preventing stale or 404 admin pages."
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_LABEL="Debug Mode"
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_DESC="When enabled, an HTML comment is added before the closing body tag listing every template CSS URL that was modified. View page source to see the log. Turn off in production."

