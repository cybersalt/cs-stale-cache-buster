; This file and plg_system_stalecachebuster.sys.ini hold exactly the same
; strings. The .sys.ini file is the one Joomla loads in the installer, the
; Plugin Manager and the Extensions Manager; the .ini file is loaded on the
; plugin settings screen. Keep the two files identical.

; Plugin name and description (installer, Plugin Manager, Extensions Manager)
PLG_SYSTEM_STALECACHEBUSTER="System - CS Stale Cache Buster"
PLG_SYSTEM_STALECACHEBUSTER_DESCRIPTION="Añade una versión basada en la fecha de modificación a las URL del CSS de tu plantilla, de modo que los navegadores descarguen una copia nueva en cuanto cambie una hoja de estilos de la plantilla. Solo afecta a los archivos CSS de la plantilla de tu sitio, no a JavaScript ni a los recursos de extensiones de terceros."

; Basic settings
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_LABEL="Evitar la caché en la administración"
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_DESC="Envía cabeceras no-cache en todas las páginas de administración. Así Cloudflare y los navegadores nunca almacenan en caché el backend, lo que evita páginas de administración obsoletas o con error 404."
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_LABEL="Modo de depuración"
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_DESC="Si está activado, se añade un comentario HTML antes de la etiqueta de cierre del body con la lista de todas las URL del CSS de la plantilla que se han modificado. Consulta el código fuente de la página para ver el registro. Desactívalo en producción."

