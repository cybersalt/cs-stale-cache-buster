; Plugin name and description (installer, Plugin Manager, Extensions Manager)
PLG_SYSTEM_STALECACHEBUSTER="System - CS Stale Cache Buster"
PLG_SYSTEM_STALECACHEBUSTER_DESCRIPTION="Şablonunuzun CSS URL adreslerine dosya değiştirilme zamanına dayalı bir sürüm bilgisi ekler; böylece bir şablon stil dosyası değiştiği anda tarayıcılar yeni kopyayı getirir. Yalnızca sitenizin şablon CSS dosyalarına dokunur, JavaScript dosyalarına veya üçüncü taraf eklenti dosyalarına dokunmaz."

; Basic settings
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_LABEL="Yönetim Paneli Önbelleğini Engelle"
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_DESC="Tüm yönetici sayfalarında önbelleğe almayı engelleyen (no-cache) başlıklar gönderir. Böylece Cloudflare ve tarayıcılar yönetim panelini asla önbelleğe almaz; eski veya 404 hatası veren yönetici sayfalarının önüne geçilir."
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_LABEL="Hata Ayıklama Modu"
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_DESC="Etkinleştirildiğinde, kapanış body etiketinden önce değiştirilen tüm şablon CSS URL adreslerini listeleyen bir HTML yorumu eklenir. Günlüğü görmek için sayfa kaynağını görüntüleyin. Canlı sitede kapatın."

