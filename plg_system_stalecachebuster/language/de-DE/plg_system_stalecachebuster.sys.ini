; Plugin name and description (installer, Plugin Manager, Extensions Manager)
PLG_SYSTEM_STALECACHEBUSTER="System - CS Stale Cache Buster"
PLG_SYSTEM_STALECACHEBUSTER_DESCRIPTION="Hängt an die CSS-URLs Ihres Templates eine Version an, die auf dem Änderungsdatum der Datei beruht, damit Browser sofort eine frische Kopie laden, sobald sich ein Template-Stylesheet ändert. Das Plugin betrifft nur die CSS-Dateien Ihres Website-Templates, nicht JavaScript oder Ressourcen von Erweiterungen anderer Anbieter."

; Basic settings
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_LABEL="Caching des Backends verhindern"
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_DESC="Sendet auf allen Administrator-Seiten No-Cache-Header. Damit wissen Cloudflare und Browser, dass sie das Backend nie zwischenspeichern dürfen. So vermeiden Sie veraltete Seiten oder 404-Fehler im Backend."
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_LABEL="Debug-Modus"
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_DESC="Wenn aktiviert, wird vor dem schließenden Body-Tag ein HTML-Kommentar eingefügt, der alle geänderten Template-CSS-URLs auflistet. Zeigen Sie den Seitenquelltext an, um das Protokoll zu sehen. Auf Live-Websites ausschalten."

