; Plugin name and description (installer, Plugin Manager, Extensions Manager)
PLG_SYSTEM_STALECACHEBUSTER="System - CS Stale Cache Buster"
PLG_SYSTEM_STALECACHEBUSTER_DESCRIPTION="Dodaje do adresów URL plików CSS szablonu wersję opartą na dacie modyfikacji pliku, dzięki czemu przeglądarki pobierają świeżą kopię od razu po zmianie arkusza stylów szablonu. Dotyczy tylko plików CSS szablonu witryny, a nie JavaScript ani zasobów rozszerzeń innych firm."

; Basic settings
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_LABEL="Blokuj buforowanie panelu administracyjnego"
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_DESC="Wysyłaj nagłówki no-cache na wszystkich stronach panelu administracyjnego. Dzięki temu Cloudflare i przeglądarki nigdy nie buforują zaplecza, co zapobiega nieaktualnym stronom lub błędom 404 w panelu."
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_LABEL="Tryb debugowania"
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_DESC="Po włączeniu przed zamykającym znacznikiem body dodawany jest komentarz HTML z listą wszystkich zmienionych adresów URL plików CSS szablonu. Aby zobaczyć ten zapis, wyświetl źródło strony. Wyłącz na działającej witrynie."

