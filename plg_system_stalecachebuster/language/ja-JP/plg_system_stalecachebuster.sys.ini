; plugin settings screen. Keep the two files identical.

; Plugin name and description (installer, Plugin Manager, Extensions Manager)
PLG_SYSTEM_STALECACHEBUSTER="System - CS Stale Cache Buster"
PLG_SYSTEM_STALECACHEBUSTER_DESCRIPTION="テンプレートのCSSのURLにファイルの更新日時に基づくバージョンを付加し、テンプレートのスタイルシートが変更されたらすぐにブラウザーが新しいコピーを取得するようにします。対象はサイトのテンプレートのCSSファイルのみで、JavaScriptやサードパーティ拡張機能のファイルには影響しません。"

; Basic settings
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_LABEL="管理画面のキャッシュを防止"
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_DESC="すべての管理画面のページでno-cacheヘッダーを送信します。Cloudflareやブラウザーがバックエンドをキャッシュしなくなるため、古い管理画面や404エラーの表示を防げます。"
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_LABEL="デバッグモード"
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_DESC="有効にすると、閉じるbodyタグの前に、変更されたテンプレートのCSSのURLをすべて一覧にしたHTMLコメントが追加されます。ログはページのソースを表示して確認できます。本番サイトではオフにしてください。"

