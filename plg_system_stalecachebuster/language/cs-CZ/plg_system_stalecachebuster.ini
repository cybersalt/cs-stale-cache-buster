PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_DESC="Odesílat hlavičky no-cache na všech stránkách administrace. Cloudflare i prohlížeče tak nikdy nebudou cachovat backend, což předchází zastaralým stránkám nebo chybám 404 v administraci."
