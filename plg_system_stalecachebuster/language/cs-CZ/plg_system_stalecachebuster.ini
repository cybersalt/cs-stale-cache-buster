; Plugin name and description (installer, Plugin Manager, Extensions Manager)
PLG_SYSTEM_STALECACHEBUSTER="System - CS Stale Cache Buster"
PLG_SYSTEM_STALECACHEBUSTER_DESCRIPTION="Přidává do URL souborů CSS vaší šablony verzi odvozenou z data úpravy souboru, takže prohlížeče stáhnou novou kopii hned, jakmile se stylopis šablony změní. Týká se pouze souborů CSS šablony webu, nikoli JavaScriptu ani souborů rozšíření třetích stran."

