; plugin settings screen. Keep the two files identical.

; Plugin name and description (installer, Plugin Manager, Extensions Manager)
PLG_SYSTEM_STALECACHEBUSTER="System - CS Stale Cache Buster"
PLG_SYSTEM_STALECACHEBUSTER_DESCRIPTION="Aggiunge una versione basata sulla data di modifica agli URL dei CSS del template, così i browser scaricano una copia aggiornata non appena un foglio di stile del template cambia. Interviene solo sui file CSS del template del tuo sito, non su JavaScript né sulle risorse di estensioni di terze parti."

; Basic settings
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_LABEL="Impedisci la cache dell'amministrazione"
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_DESC="Invia header no-cache su tutte le pagine dell'amministrazione. In questo modo Cloudflare e i browser non mettono mai in cache il backend, evitando pagine di amministrazione obsolete o con errore 404."
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_LABEL="Modalità debug"
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_DESC="Se attivata, prima del tag di chiusura del body viene aggiunto un commento HTML con l'elenco di tutti gli URL dei CSS del template che sono stati modificati. Visualizza il sorgente della pagina per vedere il log. Disattivala in produzione."

