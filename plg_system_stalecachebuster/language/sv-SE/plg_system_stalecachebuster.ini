; Plugin name and description (installer, Plugin Manager, Extensions Manager)
PLG_SYSTEM_STALECACHEBUSTER="System - CS Stale Cache Buster"
PLG_SYSTEM_STALECACHEBUSTER_DESCRIPTION="Lägger till en version baserad på filens ändringstid i CSS-URL:erna för din mall, så att webbläsarna hämtar en ny kopia så fort en stilmall ändras. Den påverkar bara CSS-filerna i webbplatsens mall, inte JavaScript eller resurser från tredjepartstillägg."

; Basic settings
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_LABEL="Förhindra cachelagring av administrationen"
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_DESC="Skicka no-cache-huvuden på alla administratörssidor. Det talar om för Cloudflare och webbläsare att aldrig cachelagra administrationen, så att du slipper föråldrade sidor eller 404-fel i administrationen."
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_LABEL="Felsökningsläge"
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_DESC="När detta är aktiverat läggs en HTML-kommentar till före den avslutande body-taggen med alla CSS-URL:er i mallen som har ändrats. Visa sidkällan för att se loggen. Stäng av på live-webbplatser."

