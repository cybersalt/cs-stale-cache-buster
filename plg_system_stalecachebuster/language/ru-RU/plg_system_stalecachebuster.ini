; Plugin name and description (installer, Plugin Manager, Extensions Manager)
PLG_SYSTEM_STALECACHEBUSTER="System - CS Stale Cache Buster"
PLG_SYSTEM_STALECACHEBUSTER_DESCRIPTION="Добавляет к URL файлов CSS вашего шаблона версию, построенную на дате изменения файла, чтобы браузеры загружали свежую копию, как только таблица стилей шаблона изменится. Затрагиваются только файлы CSS шаблона сайта, но не JavaScript и не ресурсы сторонних расширений."

; Basic settings
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_LABEL="Запретить кэширование админпанели"
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_DESC="Отправлять заголовки no-cache на всех страницах административной панели. Так Cloudflare и браузеры никогда не будут кэшировать бэкенд, и устаревшие страницы или ошибки 404 в админпанели исчезнут."
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_LABEL="Режим отладки"
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_DESC="Если включено, перед закрывающим тегом body добавляется HTML-комментарий со списком всех изменённых URL файлов CSS шаблона. Чтобы увидеть этот список, откройте исходный код страницы. На рабочем сайте отключите."

