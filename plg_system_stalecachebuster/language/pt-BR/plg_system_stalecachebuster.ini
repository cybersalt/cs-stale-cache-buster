; plugin settings screen. Keep the two files identical.

; Plugin name and description (installer, Plugin Manager, Extensions Manager)
PLG_SYSTEM_STALECACHEBUSTER="System - CS Stale Cache Buster"
PLG_SYSTEM_STALECACHEBUSTER_DESCRIPTION="Adiciona uma versão baseada na data de modificação às URLs do CSS do seu template, para que os navegadores baixem uma cópia nova assim que uma folha de estilo do template mudar. Atua apenas nos arquivos CSS do template do seu site, não em JavaScript nem em recursos de extensões de terceiros."

; Basic settings
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_LABEL="Impedir cache na administração"
PLG_SYSTEM_STALECACHEBUSTER_NO_CACHE_ADMIN_DESC="Envia cabeçalhos no-cache em todas as páginas da administração. Isso faz com que o Cloudflare e os navegadores nunca armazenem o backend em cache, evitando páginas de administração desatualizadas ou com erro 404."
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_LABEL="Modo de depuração"
PLG_SYSTEM_STALECACHEBUSTER_DEBUG_MODE_DESC="Quando ativado, um comentário HTML é adicionado antes da tag de fechamento do body, listando cada URL de CSS do template que foi modificada. Veja o código-fonte da página para consultar o registro. Desative em produção."

